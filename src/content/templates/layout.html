<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="{{ description | default('Mohammad Saif, data engineering and software development portfolio.') }}">
    <meta property="og:title" content="Mohammad Saif | {{ title | default('Portfolio') }}">
    <meta property="og:description"
        content="{{ description | default('Mohammad Saif, data engineering and software development portfolio.') }}">
    <meta property="og:type" content="website">
    <title>{% if title %}Mohammad Saif | {{ title }}{% else %}Mohammad Saif | Portfolio{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/comic-mono@0.0.1/index.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=12">

</head>

<body id="page-top">
    <header class="about-header">
        <a class="logo" href="/" aria-label="Saif home">MOHAMMAD SAIF</a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="/" {% if request.url.path in ["/", "/home"] %}aria-current="page"{% endif %}>HOME</a>
            <a href="/work" {% if request.url.path == "/work" %}aria-current="page"{% endif %}>WORK</a>
            <a href="/about" {% if request.url.path == "/about" %}aria-current="page"{% endif %}>ABOUT</a>
            <a href="/connect" {% if request.url.path == "/connect" %}aria-current="page"{% endif %}>CONNECT</a>
            <a class="nav-resume" href="/static/Mohammad_Saif_Resume.pdf" target="_blank" rel="noopener">
                RESUME <span class="nav-arrow" aria-hidden="true">↗</span>
            </a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer class="about-footer">
        <span>MOHAMMAD SAIF</span>
        <span>Building reliable data pipelines.</span>
        <a class="back-to-top" href="#page-top">Back to top <span aria-hidden="true">↑</span></a>
    </footer>

</body>

</html>
