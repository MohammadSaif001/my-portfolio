<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="{{ description | default('Mohammad Saif, data engineering and software development portfolio.') }}">
    <title>{% if title %}Mohammad Saif | {{ title }}{% else %}Mohammad Saif | Portfolio{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/comic-mono@0.0.1/index.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">

</head>

<body>
    <header class="about-header">
        <a class="logo" href="/" aria-label="Saif home">SAIF</a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="/work">WORK</a>
            <a href="/about">ABOUT</a>
            <a href="/connect">CONTACT</a>
            <div class="actions">
                {% if request.url.path not in ["/", "/home"] %}
                <a class="about-home" href="/">Home <span aria-hidden="true">&rarr;</span></a>
            </div>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer class="about-footer">
        <span>MOHAMMAD SAIF</span>
        <span>Always learning, always building.</span>
    </footer>
</body>

</html>
